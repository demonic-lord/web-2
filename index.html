<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K|R4K3N Protected Console</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        .container {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
            text-align: center;
            width: 400px;
            border: 1px solid #334155;
        }
        h1 { color: #f43f5e; font-size: 24px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #f43f5e;
        }
        button {
            background-color: #f43f5e;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover { background-color: #e11d48; }
        #status-display {
            margin-top: 25px;
            font-family: monospace;
            font-size: 14px;
            padding: 12px;
            border-radius: 6px;
            background-color: #0f172a;
            border: 1px solid #1e293b;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>System Lockout Terminal</h1>
        <p>Security protocols engaged. Automated database sync active.</p>
        
        <!-- Input fields for the SQLi simulation -->
        <div class="input-group">
            <label for="username">Database Username</label>
            <input type="text" id="username" placeholder="e.g., admin">
        </div>
        <div class="input-group">
            <label for="password">Security Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button onclick="evaluateAccessTelemetry()">Request Administrator Core Flag</button>

        <div id="status-display" style="color: #94a3b8;">System Listening...</div>
    </div>

    <script>
        /* =======================================================
           1. AGGRESSIVE CLIENT-SIDE ANTI-DEBUGGING PROTOCOLS
           ======================================================= */
        
        // Block right-clicks entirely
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Block structural shortcuts and functional inspection keys
        document.addEventListener('keydown', function(e) {
            if (
                e.key === "F12" || 
                (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J" || e.key === "C")) || 
                (e.ctrlKey && e.key === "U")
            ) {
                e.preventDefault();
                updateDisplay("Security Violation: Inspection key stroke blocked.", "#f43f5e");
                return false;
            }
        });

        /* =======================================================
           2. BACKEND EMULATION & SQL INJECTION EVALUATION
           ======================================================= */
        function updateDisplay(text, color) {
            const el = document.getElementById('status-display');
            el.textContent = text;
            el.style.color = color;
        }

        function evaluateAccessTelemetry() {
            const userInp = document.getElementById('username').value.trim();
            const passInp = document.getElementById('password').value.trim();

            if (!userInp || !passInp) {
                updateDisplay("Error: Database input query fields cannot be null.", "#f43f5e");
                return;
            }

            // Simple SQL Injection verification regex patterns
            const sqliPattern1 = /'\s*or\s*['"]?1['"]?\s*=\s*['"]?1/i;
            const sqliPattern2 = /'\s*or\s*1\s*=\s*1/i;
            const sqliPattern3 = /'--/i;

            const isSQLi = sqliPattern1.test(userInp) || sqliPattern2.test(userInp) || sqliPattern3.test(userInp) ||
                            sqliPattern1.test(passInp) || sqliPattern2.test(passInp) || sqliPattern3.test(passInp);

            if (isSQLi) {
               
                const securePayload = atob("QWNjZXNzIEdyYW50ZWQuIEZsYWc6IEt8NEszTnt3M2JfYnlwNHNzX3dpdGhfc3FsaX0=");
                updateDisplay(securePayload, "#4ade80");
            } else {
                
                const errorPayload = atob("QWNjZXNzIERlbmllZDogRGF0YWJhc2UgcXVlcnkgcmV0dXJuZWQgMCByb3dzIG1hdGNoaW5nIGNyaXRlcmlhLg==");
                updateDisplay(errorPayload, "#f43f5e");
            }
        }
    </script>
</body>
</html>
