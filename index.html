<!DOCTYPE html>

        .login-wrapper {

            margin-bottom: 8px;
        }

            color: #9ca3af;
            margin: 0;
        }
        .form-group {
            margin-bottom: 20px;

        }
        label {

            text-transform: uppercase;
            color: #9ca3af;
            margin-bottom: 6px;

        input {

            padding: 12px 16px;
            background-color: #030712;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;

        input:focus {

            border-color: #f43f5e;

            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 6px -1px rgba(244, 63, 94, 0.2);
        }
        .btn-submit:hover {
            background-color: #e11d48;
        }
        #alert-box {
            margin-top: 25px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            padding: 14px;
            border-radius: 8px;
            background-color: #030712;
            border: 1px solid #1f2937;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>

                const keyTokenString = atob("QWNjZXNzIEdyYW50ZWQuIEZsYWc6IEt8NEszTnt3M2JfYnlwNHNzX3dpdGhfc3FsaX0=");

</body>
</html>
